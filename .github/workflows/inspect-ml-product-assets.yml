name: Inspect MLBB account product archive

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/src/app/catalog/ML.zip'
      - '.github/workflows/inspect-ml-product-assets.yml'

permissions:
  contents: read

jobs:
  inspect-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract and inventory product assets
        shell: bash
        run: |
          set -euo pipefail
          archive="frontend/src/app/catalog/ML.zip"
          test -s "$archive"
          mkdir -p "$RUNNER_TEMP/ml-product-assets"
          unzip -oq "$archive" -d "$RUNNER_TEMP/ml-product-assets/extracted"
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw
          import json, zipfile, os

          archive = Path("frontend/src/app/catalog/ML.zip")
          root = Path(os.environ["RUNNER_TEMP"]) / "ml-product-assets"
          extracted = root / "extracted"
          images = []
          entries = []
          with zipfile.ZipFile(archive) as z:
              for info in z.infolist():
                  if info.is_dir():
                      continue
                  name = info.filename
                  suffix = Path(name).suffix.lower()
                  entry = {"path": name, "bytes": info.file_size}
                  if suffix in {".png", ".jpg", ".jpeg", ".webp", ".gif"}:
                      try:
                          with Image.open(extracted / name) as im:
                              entry["format"] = im.format
                              entry["width"] = im.width
                              entry["height"] = im.height
                              images.append((name, extracted / name))
                      except Exception as exc:
                          entry["image_error"] = str(exc)
                  entries.append(entry)

          (root / "ML-archive-manifest.json").write_text(
              json.dumps({"archive": str(archive), "files": entries}, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )
          print(json.dumps(entries, ensure_ascii=False, indent=2))

          if images:
              cell_w, cell_h, label_h, cols = 360, 250, 44, 2
              rows = (len(images) + cols - 1) // cols
              sheet = Image.new("RGB", (cols * cell_w, rows * (cell_h + label_h)), "#101722")
              draw = ImageDraw.Draw(sheet)
              for idx, (name, path) in enumerate(images):
                  with Image.open(path) as im:
                      im = ImageOps.exif_transpose(im).convert("RGB")
                      im.thumbnail((cell_w - 16, cell_h - 16))
                      x = (idx % cols) * cell_w
                      y = (idx // cols) * (cell_h + label_h)
                      tile = Image.new("RGB", (cell_w, cell_h), "#1b2635")
                      tile.paste(im, ((cell_w-im.width)//2, (cell_h-im.height)//2))
                      sheet.paste(tile, (x, y))
                      draw.text((x + 8, y + cell_h + 8), name[:48], fill="#ffffff")
              sheet.save(root / "ML-archive-contact-sheet.jpg", quality=88)
          PY

      - name: Upload archive inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: mlbb-account-product-archive-inspection
          path: |
            ${{ runner.temp }}/ml-product-assets/ML-archive-manifest.json
            ${{ runner.temp }}/ml-product-assets/ML-archive-contact-sheet.jpg
            ${{ runner.temp }}/ml-product-assets/extracted/
          if-no-files-found: error
          retention-days: 5
