name: VAULT CORE CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract and verify the committed VAULT CORE visual asset library
        shell: bash
        run: |
          set -euo pipefail
          archive="frontend/VAULT_CORE_ASSET_LIBRARY_v1.0.zip"
          temp_dir="$RUNNER_TEMP/vault-core-assets"
          public_dir="frontend/public/assets"
          test -s "$archive"
          rm -rf "$temp_dir" "$public_dir"
          mkdir -p "$temp_dir" "$public_dir"
          unzip -oq "$archive" -d "$temp_dir"
          source_dir="$temp_dir/VAULT_CORE_ASSETS"
          test -d "$source_dir"
          cp -a "$source_dir/." "$public_dir/"
          echo "Extracted asset inventory:"
          find "$public_dir" -type f -printf '%P (%s bytes)\n' | sort
          test -s "$public_dir/01-brand/vaultcore-horizontal.svg"
          test -s "$public_dir/02-hero/hero-vaultcore-loop.webp"
          test -s "$public_dir/03-categories/category-mlbb.png"
          test -s "$public_dir/03-categories/category-roblox.png"
          test -s "$public_dir/03-categories/category-free-fire.png"
          test -s "$public_dir/03-categories/category-genshin.png"
          test -s "$public_dir/03-categories/category-other.png"
          test -s "$public_dir/04-tiers/tier-platinum.png"
          test -s "$public_dir/06-icons/icon-wallet.svg"
          test -s "$public_dir/06-icons/icon-shield.svg"
          test -s "$public_dir/06-icons/icon-orders.svg"
          test -s "$public_dir/01-brand/favicon.svg"
          test -s "$public_dir/01-brand/favicon.png"
          test -s "$public_dir/01-brand/pwa-icon-192.png"
          test -s "$public_dir/09-social/og-cover-1200x630.jpg"
          echo "Brand logo, all game category images, trust icons, favicon, PWA icon and social cover are present."
          cat "$public_dir/README.md"
          cat "$public_dir/asset-manifest.json"
      - name: Extract MLBB product images from the committed catalogue source
        shell: bash
        run: |
          set -euo pipefail
          archive="frontend/src/app/catalog/ML.zip"
          temp_dir="$RUNNER_TEMP/mlbb-product-assets"
          target_dir="frontend/public/assets/catalog/mlbb"
          test -s "$archive"
          rm -rf "$temp_dir" "$target_dir"
          mkdir -p "$temp_dir" "$target_dir"
          unzip -oq "$archive" 'ML/250/*' -d "$temp_dir"
          install -m 644 "$temp_dir/ML/250/bzvk6k6266lwo82h1pn0q.jpg" "$target_dir/ml-001-primary.jpg"
          install -m 644 "$temp_dir/ML/250/cqeqw0smpt5v9x6052g1me.jpg" "$target_dir/ml-001-skins.jpg"
          install -m 644 "$temp_dir/ML/250/download (5).webp" "$target_dir/ml-001-emblem.webp"
          install -m 644 "$temp_dir/ML/250/szq89uuikvkjhaxo0x6ri.jpg" "$target_dir/ml-001-skins-detail.jpg"
          install -m 644 "$temp_dir/ML/250/zktvmqe40kkgh6ft8jogfa.jpg" "$target_dir/ml-001-account-detail.jpg"
          for asset in ml-001-primary.jpg ml-001-skins.jpg ml-001-emblem.webp ml-001-skins-detail.jpg ml-001-account-detail.jpg; do
            test -s "$target_dir/$asset" || { echo "::error::Missing MLBB product asset: $asset"; exit 1; }
          done
          echo "All original ML-001 product assets from ML.zip are present."
      - name: Verify every storefront asset URL resolves
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const sources = [
            'frontend/src/app/globals.css',
            'frontend/src/app/mobile-app.css',
            'frontend/src/app/catalog/page.css',
            'frontend/public/miniapp/app.css',
            'frontend/public/miniapp/app.js',
            'frontend/public/miniapp/index.html',
            'frontend/src/app/page.jsx',
            'frontend/src/app/catalog/page.jsx',
            'frontend/src/app/admin/page.jsx',
            'frontend/src/app/layout.jsx'
          ].map((file) => fs.readFileSync(file, 'utf8')).join('\n');
          const paths = [...sources.matchAll(/\/assets\/([A-Za-z0-9_./-]+)/g)]
            .map((match) => match[1].replace(/[),.;]+$/, ''));
          const missing = [...new Set(paths)].filter((asset) => !fs.existsSync('frontend/public/assets/' + asset));
          console.log('Storefront asset references checked:', paths.length);
          if (missing.length) {
            console.error('Missing public assets:', missing.join(', '));
            process.exit(1);
          }
          console.log('All storefront asset references resolve to the extracted library.');
          NODE

      - name: Verify Itemku game logo assets referenced by uploaded ZIPs
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            "https://d1x91p7vw3vuq8.cloudfront.net/game/2024109/rcks2r0xntbibkh7gf72p.png"
            "https://d1x91p7vw3vuq8.cloudfront.net/game/2025124/vhyvvmjoekra0kyu3a2af4.svg"
            "https://d1x91p7vw3vuq8.cloudfront.net/game/2024711/93cu2pbsceeiior5v9yc2q.png"
            "https://d1x91p7vw3vuq8.cloudfront.net/game/2025118/z9t30wkd81lxiwmaio40v.webp"
          )
          for url in "${urls[@]}"; do
            code="$(curl --location --silent --show-error --output /dev/null --write-out '%{http_code}' "$url")"
            if [[ "$code" != "200" ]]; then
              echo "::error::Itemku game logo returned HTTP $code: $url"
              exit 1
            fi
          done
          echo "All four supplied Itemku game logo image references returned HTTP 200."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate VAULT CORE v5 Mini App shell and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for file in frontend/public/miniapp/index.html frontend/public/miniapp/app.css frontend/public/miniapp/app.js frontend/public/miniapp/config.js frontend/public/miniapp/manifest.webmanifest frontend/public/miniapp/sw.js; do
            test -s "$file" || { echo "::error::Missing Mini App asset: $file"; exit 1; }
          done
          node --check frontend/public/miniapp/app.js
          node --check frontend/public/miniapp/sw.js
          echo "VAULT CORE v5 Mini App shell and JavaScript syntax passed."

      - name: Install workspace dependencies
        run: npm install --workspaces --include-workspace-root --no-audit --no-fund

      - name: Run backend and core tests
        run: npm test

      - name: Build Mini App
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.example.invalid
        run: npm run build:frontend

      - name: Validate API Worker bundle (dry run)
        run: npx --yes wrangler@latest deploy --dry-run --config wrangler.api.jsonc
