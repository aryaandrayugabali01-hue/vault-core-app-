name: VAULT CORE CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract the committed VAULT CORE visual asset library
        shell: bash
        run: |
          set -euo pipefail
          test -s frontend/VAULT_CORE_ASSET_LIBRARY_v1.0.zip
          mkdir -p frontend/public/assets
          echo "VAULT CORE asset archive inventory:"
          unzip -Z1 frontend/VAULT_CORE_ASSET_LIBRARY_v1.0.zip | sort
          unzip -oq frontend/VAULT_CORE_ASSET_LIBRARY_v1.0.zip -d frontend/public/assets
          echo "Extracted public asset inventory:"
          find frontend/public/assets -type f -printf '%P (%s bytes)\\n' | sort
          test -n "$(find frontend/public/assets -type f -print -quit)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install workspace dependencies
        run: npm install --workspaces --include-workspace-root --no-audit --no-fund

      - name: Run backend and core tests
        run: npm test

      - name: Build Mini App
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.example.invalid
        run: npm run build:frontend

      - name: Validate API Worker bundle (dry run)
        run: npx --yes wrangler@latest deploy --dry-run --config wrangler.api.jsonc
