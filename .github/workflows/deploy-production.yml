name: VAULT CORE production deployment

on:
  push:
    branches:
      - main
    paths:
      - 'cloudflare/vault-core-api.js'
      - 'backend/**'
      - 'bot/**'
      - 'database/migrations/**'
      - 'frontend/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.api.jsonc'
      - '.github/workflows/deploy-production.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vault-core-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "67d2069a9ae076d3ce63a9aca629ea8b"
      CLOUDFLARE_ZONE_ID: "74092a358232c7bf501da8d822fabb47"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
      ADMIN_TELEGRAM_IDS: ${{ secrets.ADMIN_TELEGRAM_IDS }}
      APP_ENCRYPTION_KEY: ${{ secrets.APP_ENCRYPTION_KEY }}
      SUPPORT_CONTACT: ${{ secrets.SUPPORT_CONTACT }}
      WEB_ORIGIN: "https://vault-core-web.premiumdigital-id.workers.dev"
      API_ORIGIN: "https://vault-core-api.premiumdigital-id.workers.dev"
      TELEGRAM_WEBHOOK_URL: "https://api.vaultcore.biz.id/api/telegram/webhook"
    steps:
      - name: Checkout production main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked workspace dependencies
        run: npm ci --workspaces --include-workspace-root --no-audit --no-fund

      - name: Validate secrets, Cloudflare account/token, Hyperdrive and Telegram bot
        shell: bash
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_API_TOKEN TELEGRAM_BOT_TOKEN TELEGRAM_WEBHOOK_SECRET ADMIN_TELEGRAM_IDS APP_ENCRYPTION_KEY; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Required repository secret is missing: ${key}"
              exit 1
            fi
          done
          if [[ ! "$TELEGRAM_WEBHOOK_SECRET" =~ ^[A-Za-z0-9_-]{1,256}$ ]]; then
            echo "::error::TELEGRAM_WEBHOOK_SECRET must contain 1-256 characters from A-Z, a-z, 0-9, underscore or hyphen."
            exit 1
          fi
          node --input-type=module -e '
            const raw = process.env.APP_ENCRYPTION_KEY ?? "";
            const key = raw.replace(/\s+/g, "");
            const decoded = Buffer.from(key, "base64");
            const canonical = decoded.toString("base64");
            if (decoded.length !== 32 || canonical.replace(/=+$/, "") !== key.replace(/=+$/, "")) {
              console.error("APP_ENCRYPTION_KEY invalid: whitespace-normalized character count=" + key.length + ", decoded byte count=" + decoded.length + ". Generate a one-line standard Base64 key from exactly 32 random bytes and copy only the output.");
              process.exit(1);
            }
            if (raw !== key) {
              const fs = await import("node:fs");
              fs.appendFileSync(process.env.GITHUB_ENV, "APP_ENCRYPTION_KEY=" + key + "\n");
            }
            const ids = process.env.ADMIN_TELEGRAM_IDS.split(",").map((v) => v.trim()).filter(Boolean);
            if (!ids.length || ids.some((v) => !/^[0-9]+$/.test(v))) {
              console.error("ADMIN_TELEGRAM_IDS must be a comma-separated list of numeric Telegram user IDs.");
              process.exit(1);
            }
          '
          token_status="$(curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify)"
          echo "$token_status" | jq -e '.success == true and .result.status == "active"' >/dev/null
          hyperdrive="$(curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/hyperdrive/configs/97e2993f7733422abd08bfbf699ce4e4")"
          echo "$hyperdrive" | jq -e '.success == true and .result.name == "vault-core-neon"' >/dev/null
          bot="$(curl --fail --silent --show-error "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/getMe")"
          echo "$bot" | jq -e '.ok == true and .result.is_bot == true and (.result.username | type == "string")' >/dev/null
          echo "Required secrets, Cloudflare token, Hyperdrive read access, and Telegram bot identity passed preflight."

      - name: Run backend and core tests
        run: npm test

      - name: Deploy API Worker
        run: npx --yes wrangler@latest deploy --config wrangler.api.jsonc

      - name: Set API Worker secrets
        shell: bash
        run: |
          set -euo pipefail
          for key in TELEGRAM_BOT_TOKEN TELEGRAM_WEBHOOK_SECRET ADMIN_TELEGRAM_IDS APP_ENCRYPTION_KEY; do
            printf '%s' "${!key}" | npx --yes wrangler@latest secret put "$key" --config wrangler.api.jsonc
          done
          if [[ -n "${SUPPORT_CONTACT:-}" ]]; then
            printf '%s' "$SUPPORT_CONTACT" | npx --yes wrangler@latest secret put SUPPORT_CONTACT --config wrangler.api.jsonc
          fi

      - name: Deploy frontend Worker
        run: npm --workspace frontend run deploy:vinext

      - name: Verify application Workers and database health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 10 --retry-delay 5 --retry-all-errors "$API_ORIGIN/health" -o /tmp/vault-api-health.json
          node --input-type=module -e '
            const fs = await import("node:fs");
            const h = JSON.parse(fs.readFileSync("/tmp/vault-api-health.json", "utf8"));
            if (h.status !== "ok" || h.database !== "connected") throw new Error("API health/database check failed");
          '
          curl --fail --silent --show-error --retry 10 --retry-delay 5 --retry-all-errors "$WEB_ORIGIN/" -o /dev/null
          echo "API Worker and frontend Worker returned successful responses."

      - name: Configure existing gateway upstream origins
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$WEB_ORIGIN" | npx --yes wrangler@latest secret put WEB_ORIGIN --name vault-core-gateway
          printf '%s' "$API_ORIGIN" | npx --yes wrangler@latest secret put API_ORIGIN --name vault-core-gateway

      - name: Attach production domains to the existing gateway
        shell: bash
        run: |
          set -euo pipefail
          attach_domain() {
            local hostname="$1"
            local existing service response
            existing="$(curl --fail --silent --show-error -G \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" \
              --data-urlencode "zone_id=$CLOUDFLARE_ZONE_ID" \
              --data-urlencode "hostname=$hostname")"
            service="$(echo "$existing" | jq -r --arg h "$hostname" '.result[]? | select(.hostname == $h) | .service' | head -n 1)"
            if [[ -n "$service" ]]; then
              if [[ "$service" != "vault-core-gateway" ]]; then
                echo "::error::Domain $hostname is attached to a different Worker: $service"
                exit 1
              fi
              echo "$hostname already points to vault-core-gateway."
              return
            fi
            response="$(curl --fail --silent --show-error -X PUT \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" \
              --data "$(jq -n --arg hostname "$hostname" --arg service "vault-core-gateway" --arg zone "$CLOUDFLARE_ZONE_ID" '{hostname:$hostname,service:$service,zone_id:$zone}')")"
            echo "$response" | jq -e '.success == true' >/dev/null
            echo "Attached $hostname to vault-core-gateway."
          }
          attach_domain "vaultcore.biz.id"
          attach_domain "www.vaultcore.biz.id"
          attach_domain "api.vaultcore.biz.id"

      - name: Verify public domains and gateway upstream configuration
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 20 --retry-delay 6 --retry-all-errors https://api.vaultcore.biz.id/health -o /tmp/vault-public-api-health.json
          node --input-type=module -e '
            const fs = await import("node:fs");
            const h = JSON.parse(fs.readFileSync("/tmp/vault-public-api-health.json", "utf8"));
            if (h.status !== "ok" || h.database !== "connected") throw new Error("Public API health/database check failed");
          '
          curl --fail --silent --show-error --retry 20 --retry-delay 6 --retry-all-errors https://vaultcore.biz.id/ -o /dev/null
          curl --fail --silent --show-error --retry 20 --retry-delay 6 --retry-all-errors https://www.vaultcore.biz.id/ -o /dev/null
          gateway_health="$(curl --fail --silent --show-error https://vaultcore.biz.id/_gateway/health)"
          echo "$gateway_health" | jq -e '.routes.apiConfigured == true and .routes.frontendConfigured == true' >/dev/null
          echo "Root, www, api, TLS, and both gateway origins are responding."

      - name: Configure Telegram production webhook
        run: npm run setup:webhook

      - name: Verify Telegram webhook read-back
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e '
            const expected = process.env.TELEGRAM_WEBHOOK_URL;
            const response = await fetch("https://api.telegram.org/bot" + process.env.TELEGRAM_BOT_TOKEN + "/getWebhookInfo");
            const result = await response.json();
            if (!response.ok || !result.ok || result.result.url !== expected) {
              console.error("Telegram webhook URL read-back verification failed.");
              process.exit(1);
            }
            console.log("Telegram webhook URL verified.");
          '
          echo "Deployment health checks completed. Live order, Stars payment, refund, delivery and UAT tests remain a separate release gate."

      - name: Ensure encrypted non-redeemable Owner test fixtures
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';

          const apiOrigin = process.env.API_ORIGIN;
          const botToken = process.env.TELEGRAM_BOT_TOKEN;
          const configuredIds = String(process.env.ADMIN_TELEGRAM_IDS || '')
            .split(',').map((value) => value.trim()).filter((value) => /^[0-9]+$/.test(value));
          const ownerId = configuredIds[0];
          if (!apiOrigin || !botToken || !ownerId) {
            throw new Error('Owner fixture bootstrap configuration is missing.');
          }

          const params = new URLSearchParams();
          params.set('auth_date', String(Math.floor(Date.now() / 1000)));
          params.set('user', JSON.stringify({
            id: Number(ownerId),
            first_name: 'VAULT CORE Owner'
          }));
          const checkString = [...params.entries()]
            .sort(([a], [b]) => a.localeCompare(b))
            .map(([key, value]) => `${key}=${value}`)
            .join('\n');
          const secretKey = crypto.createHmac('sha256', 'WebAppData').update(botToken).digest();
          const hash = crypto.createHmac('sha256', secretKey).update(checkString).digest('hex');
          params.set('hash', hash);

          const headers = {
            'content-type': 'application/json',
            'x-telegram-init-data': params.toString()
          };
          const seeded = await fetch(`${apiOrigin}/api/admin/test-fixtures`, {
            method: 'POST',
            headers,
            body: '{}'
          });
          const seedBody = await seeded.json().catch(() => ({}));
          if (!seeded.ok || seedBody.createdOrVerified !== 4) {
            console.error('Owner fixture bootstrap failed:', JSON.stringify({
              status: seeded.status,
              error: seedBody.error || null,
              stage: seedBody.stage || null,
              message: seedBody.message || null
            }));
            process.exit(1);
          }

          const checked = await fetch(`${apiOrigin}/api/admin/test-fixtures`, {
            headers: { 'x-telegram-init-data': params.toString() },
            cache: 'no-store'
          });
          const checkBody = await checked.json().catch(() => ({}));
          const fixtures = checkBody.products || [];
          const valid = checked.ok && fixtures.length === 4
            && fixtures.every((item) => item.is_test === true
              && Number(item.sellable_stock) >= 1
              && item.sale_price_xtr === 1);
          if (!valid) {
            console.error('Owner fixture verification failed:', JSON.stringify({
              status: checked.status,
              fixtureCount: fixtures.length,
              fixtures: fixtures.map((item) => ({
                sku: item.sku,
                is_test: item.is_test,
                status: item.status,
                sellable_stock: item.sellable_stock,
                sale_price_xtr: item.sale_price_xtr
              }))
            }));
            process.exit(1);
          }
          console.log('Verified four encrypted non-redeemable fixtures with one or more stock units each. Products remain in their current status; no invoice or payment was created.');
          NODE
