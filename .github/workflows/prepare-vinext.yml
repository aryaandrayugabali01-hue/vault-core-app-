name: VAULT CORE Cloudflare frontend preparation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  prepare-vinext:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install existing workspace
        run: npm install --workspaces --include-workspace-root --no-audit --no-fund

      - name: Check Next.js compatibility with current vinext
        working-directory: frontend
        run: npx --yes vinext@latest check

      - name: Initialize native Cloudflare Workers integration
        working-directory: frontend
        run: npx --yes vinext@latest init --platform=cloudflare --name vault-core-web --cdn-cache=none --data-cache=none --image-optimization=none --ignore-wrangler-config

      - name: Install generated Cloudflare deployment dependencies
        run: npm install --workspaces --include-workspace-root --no-audit --no-fund

      - name: Verify Cloudflare Worker configuration
        working-directory: frontend
        run: |
          test -f cloudflare.config.ts
          test -f vite.config.ts
          grep -q 'cloudflare' vite.config.ts
          node -e "const p=require('./package.json'); for (const s of ['build:vinext','start:vinext','deploy:vinext']) if (!p.scripts?.[s]) throw new Error('Missing script: '+s)"
          echo "Native vinext Cloudflare configuration is present."

      - name: Build Cloudflare frontend Worker
        working-directory: frontend
        run: npm run build:vinext

      - name: Verify generated Worker build output
        working-directory: frontend
        run: |
          test -d .cloudflare
          find .cloudflare -maxdepth 3 -type f | head -40

      - name: Commit generated configuration and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "chore(frontend): configure native vinext Cloudflare Worker"
            git push origin HEAD:main
          fi
